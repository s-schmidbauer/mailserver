server "blog.schmidbauer.cz" {
        listen on * tls port 443

        root "htdocs/blog.schmidbauer.cz"

        {% if httpd_block_bad_locations %}include '{{ httpd_bad_locations_path }}'{% endif %}

        # allow 2G file size
        connection {
                max request body 2000000000
                max requests 20
                request timeout 300
        }

        tls {
                ciphers "EECDH+AESGCM:EDH+AESGCM"
                ecdhe "P-384,P-256,X25519"
                certificate "/etc/ssl/blog.schmidbauer.cz.fullchain.pem"
                key "/etc/ssl/private/blog.schmidbauer.cz.key"
                #ocsp "/etc/ssl/blog.schmidbauer.cz.der"
        }

}
